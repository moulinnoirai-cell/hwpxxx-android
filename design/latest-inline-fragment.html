#hwpxxx-library-complete-intro{width:100%;font-family:HwpxxxMock,system-ui,-apple-system,"Noto Sans KR",sans-serif}
#hwpxxx-library-complete-intro *{box-sizing:border-box}
#hwpxxx-library-complete-intro [hidden]{display:none!important}
#hwpxxx-library-complete-intro .hw-preview-controls{display:flex;justify-content:center;margin-bottom:14px}
#hwpxxx-library-complete-intro .hw-preview-stage{padding:20px 8px;border-radius:20px;display:flex;justify-content:center}
#hwpxxx-library-complete-intro .hw-phone{--hw-bg:light-dark(#f5f6fa,#141922);--hw-surface:light-dark(#fff,#1e2530);--hw-ink:light-dark(#202c40,#eaf0fa);--hw-muted:light-dark(#59677b,#b0bdd0);--hw-line:light-dark(#e1e6ef,#384456);--hw-brand:light-dark(#3156c9,#b6c7ff);--hw-onbrand:light-dark(#fff,#17264f);--hw-soft:light-dark(#eaf0ff,#2b3a59);--hw-scrim:light-dark(#17254166,#00000099);color-scheme:light dark;background:var(--hw-bg);color:var(--hw-ink);width:360px;max-width:100%;height:680px;border:1px solid var(--hw-line);border-radius:24px;position:relative;overflow:hidden;box-shadow:0 12px 35px #00000014;font-size:14px;line-height:1.55}
#hwpxxx-library-complete-intro .hw-phone[data-theme=light]{color-scheme:light}
#hwpxxx-library-complete-intro .hw-phone[data-theme=dark]{color-scheme:dark}
#hwpxxx-library-complete-intro .hw-screen{height:100%;display:flex;flex-direction:column;min-height:0}
#hwpxxx-library-complete-intro .hw-phone{color-scheme:inherit}
#hwpxxx-library-complete-intro .hw-phone button,#hwpxxx-library-complete-intro .hw-phone input,#hwpxxx-library-complete-intro .hw-phone select{font:inherit;color:inherit}
#hwpxxx-library-complete-intro .hw-phone button{border:0;background:transparent;padding:0;touch-action:manipulation}
#hwpxxx-library-complete-intro .hw-phone svg{width:22px;height:22px;flex:none;stroke-width:1.8;pointer-events:none}
#hwpxxx-library-complete-intro .hw-icon{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
#hwpxxx-library-complete-intro .hw-header{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;background:var(--hw-surface);flex:none}
#hwpxxx-library-complete-intro .hw-search{height:50px;display:flex;align-items:center;gap:9px;padding-left:12px;background:var(--hw-bg);color:var(--hw-muted);border-radius:13px;min-width:0;flex:1}
#hwpxxx-library-complete-intro .hw-search input{border:0;background:transparent;outline:none;min-width:0;width:100%;font-size:16px;height:100%;color:var(--hw-ink)}
#hwpxxx-library-complete-intro .hw-search input::placeholder{color:var(--hw-muted)}
#hwpxxx-library-complete-intro .hw-search input::-webkit-search-cancel-button{display:none}
#hwpxxx-library-complete-intro .hw-search .hw-clear{width:44px;height:48px}
#hwpxxx-library-complete-intro .hw-header .hw-settings{width:50px;height:50px;background:var(--hw-soft);color:var(--hw-brand);border-radius:13px}
#hwpxxx-library-complete-intro .hw-tools{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:7px 14px;font-size:12px;color:var(--hw-muted);flex:none}
#hwpxxx-library-complete-intro .hw-sort-tools{display:flex;gap:6px;align-items:center;min-width:0}
#hwpxxx-library-complete-intro .hw-sort-tools select{border:0;background:var(--hw-bg);font-size:12px;max-width:115px;min-height:48px;border-radius:8px}
#hwpxxx-library-complete-intro .hw-doc-area{position:relative;flex:1;min-height:0}
#hwpxxx-library-complete-intro .hw-doc-scroll{height:100%;overflow:auto;overscroll-behavior:contain;padding:0 16px 20px;scrollbar-width:none}
#hwpxxx-library-complete-intro .hw-doc-scroll::-webkit-scrollbar{display:none}
#hwpxxx-library-complete-intro .hw-docs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#hwpxxx-library-complete-intro .hw-doc{position:relative;min-width:0;background:var(--hw-surface);border:1px solid var(--hw-line);border-radius:14px;overflow:hidden}
#hwpxxx-library-complete-intro .hw-doc .hw-open{display:block;width:100%;text-align:left;min-width:0}
#hwpxxx-library-complete-intro .hw-thumb{height:110px;overflow:hidden;background:#fff;position:relative}
#hwpxxx-library-complete-intro .hw-mini{height:216px;min-width:0;padding:17px 14px 12px;background:#fff;color:#273142;font-size:8px;line-height:1.5;user-select:none}
#hwpxxx-library-complete-intro .hw-mini .hw-mini-kicker{font-size:6px;color:#657180;text-align:center;margin:0 0 7px}
#hwpxxx-library-complete-intro .hw-mini strong{display:block;font-size:10px;font-weight:500;text-align:center;margin-bottom:12px}
#hwpxxx-library-complete-intro .hw-mini .hw-line{height:2px;background:#aab3c1;margin:6px 0;width:100%;opacity:.8}
#hwpxxx-library-complete-intro .hw-mini .hw-line.short{width:72%}
#hwpxxx-library-complete-intro .hw-mini-table{height:55px;border:1px solid #9faab8;margin-top:12px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 12px,#d6dce4 12px,#d6dce4 13px),repeating-linear-gradient(to right,transparent 0,transparent 29px,#d6dce4 29px,#d6dce4 30px)}
#hwpxxx-library-complete-intro .hw-doc-text{padding:10px 12px 10px;min-width:0}
#hwpxxx-library-complete-intro .hw-name{font-size:13px;line-height:1.5;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-height:39px}
#hwpxxx-library-complete-intro .hw-path{font-size:12px;color:var(--hw-muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hwpxxx-library-complete-intro .hw-ext{font-size:11px;color:var(--hw-muted);padding-top:3px}
#hwpxxx-library-complete-intro .hw-star{position:absolute;top:4px;left:4px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;z-index:1;isolation:isolate;color:var(--hw-muted);border-radius:50%}
#hwpxxx-library-complete-intro .hw-star::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--hw-surface);box-shadow:0 1px 5px #00000026;z-index:-1}
#hwpxxx-library-complete-intro .hw-star svg{width:24px;height:24px;fill:transparent}
#hwpxxx-library-complete-intro .hw-star[aria-pressed=true]{color:var(--hw-brand)}
#hwpxxx-library-complete-intro .hw-star[aria-pressed=true] svg{fill:currentColor}
#hwpxxx-library-complete-intro .hw-docs[data-view=list]{grid-template-columns:1fr}
#hwpxxx-library-complete-intro .hw-docs[data-view=list] .hw-doc{padding-left:56px}
#hwpxxx-library-complete-intro .hw-docs[data-view=list] .hw-doc-text{padding:12px 12px 12px 4px}
#hwpxxx-library-complete-intro .hw-docs[data-view=list] .hw-name{min-height:0}
#hwpxxx-library-complete-intro .hw-docs[data-view=list] .hw-ext{display:none}
#hwpxxx-library-complete-intro .hw-docs[data-view=list] .hw-star{top:50%;transform:translateY(-50%)}

 function renamePreview(){
  const dot=selectedDocument.name.lastIndexOf('.'),stem=selectedDocument.name.slice(0,dot),extension=selectedDocument.name.slice(dot);
  dialog('이름 변경',`<label>파일 이름<div class="hw-form-name"><input class="hw-text-input" aria-label="파일 이름" value="${escape(stem)}"><span class="hw-file-extension">${escape(extension)}</span></div></label><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="close-dialog">취소</button><button type="button" class="hw-main-button" data-act="close-dialog">변경</button></div>`);
 }
 function pdfPreview(){
  if(!pdfName)pdfName=selectedDocument.name.replace(/\.[^.]+$/,'');
  dialog('PDF 저장',`<label>파일 이름<div class="hw-form-name"><input class="hw-text-input" data-pdf-name aria-label="PDF 파일 이름" value="${escape(pdfName)}"><span class="hw-file-extension">.pdf</span></div></label><label>저장 위치</label><button type="button" class="hw-location-control" data-act="pdf-location">${i('folder')}<span>${escape(folderPath||selectedDocument.folder)}</span>${i('chevron-right')}</button><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="close-dialog">취소</button><button type="button" class="hw-main-button" data-act="close-dialog">저장</button></div>`);
 }
 function infoPreview(){
  const d=selectedDocument;
  dialog('파일 정보',`<dl class="hw-info-list"><dt>이름</dt><dd>${escape(d.name)}</dd><dt>위치</dt><dd>내장 저장공간/${escape(d.folder)}</dd><dt>형식</dt><dd>${d.type}</dd><dt>크기</dt><dd>${escape(d.size)}</dd></dl>`);
 }
 function foldersPreview(purpose=folderPurpose,path=folderPath){
  folderPurpose=purpose;folderPath=path;
  const folders=folderPath?['업무자료','보관함',...previewFolders]:['Download','Documents','DCIM','Pictures','Recordings',...previewFolders];
  const same=folderPurpose==='move'&&folderPath===selectedDocument.folder;
  dialog('폴더 선택',`<div class="hw-folder-path">내장 저장공간${folderPath?' / '+escape(folderPath):''}</div><div class="hw-folder-list">${folderPath?`<button type="button" class="hw-folder-row" data-act="folder-parent">${i('corner-left-up')}<span>상위 폴더</span></button>`:''}${folders.map(f=>`<button type="button" class="hw-folder-row" data-act="folder-enter" data-folder="${escape(f)}">${i('folder')}<span>${escape(f)}</span>${i('chevron-right')}</button>`).join('')}</div><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="${folderPurpose==='pdf'?'pdf-preview':'close-dialog'}">취소</button><button type="button" class="hw-main-button" data-act="folder-confirm" ${same?'disabled':''}>${folderPurpose==='pdf'?'이 폴더 선택':'여기로 이동'}</button></div>`);
  const box=layer.querySelector('.hw-dialog');box.classList.add('hw-folder-dialog');
  const create=document.createElement('button');create.type='button';create.className='hw-icon cursor-interaction';create.dataset.act='folder-create';create.setAttribute('aria-label','폴더 만들기');create.innerHTML=i('folder-plus');
  const header=box.querySelector('.hw-dialog-header');header.insertBefore(create,header.lastElementChild);paintIcons();
 }
 function newFolderPreview(){
  dialog('폴더 만들기',`<label>폴더 이름<input class="hw-text-input" data-new-folder aria-label="폴더 이름" placeholder="새 폴더"></label><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="folder-cancel-create">취소</button><button type="button" class="hw-main-button" data-act="folder-create-confirm">만들기</button></div>`);
 }
 root.addEventListener('click',e=>{
  const button=e.target.closest('[data-act]');if(!button||button.disabled)return;
  const act=button.dataset.act;
  if(act==='rename-preview')renamePreview();
  else if(act==='move-preview'){folderPath=selectedDocument.folder;previewFolders=[];foldersPreview('move');}
  else if(act==='pdf-preview'){pdfPreview();}
  else if(act==='info-preview')infoPreview();
  else if(act==='pdf-location'){pdfName=layer.querySelector('[data-pdf-name]')?.value||pdfName;foldersPreview('pdf',folderPath||selectedDocument.folder);}
  else if(act==='folder-enter')foldersPreview(folderPurpose,folderPath?folderPath+'/'+button.dataset.folder:button.dataset.folder);
  else if(act==='folder-parent')foldersPreview(folderPurpose,folderPath.split('/').slice(0,-1).join('/'));
  else if(act==='folder-confirm'){if(folderPurpose==='pdf')pdfPreview();else closeDialog();}
  else if(act==='folder-create')newFolderPreview();
  else if(act==='folder-cancel-create')foldersPreview();
  else if(act==='folder-create-confirm'){const name=layer.querySelector('[data-new-folder]').value.trim();if(name)previewFolders.push(name);foldersPreview();}
 });
 let longPress=null,pressStart=null;
 function cancelLongPress(){clearTimeout(longPress);longPress=null;pressStart=null;}
 root.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.hw-star'))return;const item=e.target.closest('.hw-doc');if(!item)return;pressStart={x:e.clientX,y:e.clientY};longPress=setTimeout(()=>{docMenu(item.dataset.doc);cancelLongPress();},500);});
 root.addEventListener('pointermove',e=>{if(pressStart&&Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>10)cancelLongPress();});
 root.addEventListener('pointerup',cancelLongPress);root.addEventListener('pointercancel',cancelLongPress);
 root.addEventListener('contextmenu',e=>{const item=e.target.closest('.hw-doc');if(!item)return;e.preventDefault();cancelLongPress();docMenu(item.dataset.doc);});
 const previewPane=root.closest('[data-variant]');
 if(previewPane){const paneObserver=new MutationObserver(()=>{if(previewPane.hidden)pauseIntro();else resumeIntro();});paneObserver.observe(previewPane,{attributes:true,attributeFilter:['hidden']});addEventListener('pagehide',()=>paneObserver.disconnect(),{once:true});}

 render();
})();
</script>

#hwpxxx-library-complete-grid{width:100%;font-family:HwpxxxMock,system-ui,-apple-system,"Noto Sans KR",sans-serif}
#hwpxxx-library-complete-grid *{box-sizing:border-box}
#hwpxxx-library-complete-grid [hidden]{display:none!important}
#hwpxxx-library-complete-grid .hw-preview-controls{display:flex;justify-content:center;margin-bottom:14px}
#hwpxxx-library-complete-grid .hw-preview-stage{padding:20px 8px;border-radius:20px;display:flex;justify-content:center}
#hwpxxx-library-complete-grid .hw-phone{--hw-bg:light-dark(#f5f6fa,#141922);--hw-surface:light-dark(#fff,#1e2530);--hw-ink:light-dark(#202c40,#eaf0fa);--hw-muted:light-dark(#59677b,#b0bdd0);--hw-line:light-dark(#e1e6ef,#384456);--hw-brand:light-dark(#3156c9,#b6c7ff);--hw-onbrand:light-dark(#fff,#17264f);--hw-soft:light-dark(#eaf0ff,#2b3a59);--hw-scrim:light-dark(#17254166,#00000099);color-scheme:light dark;background:var(--hw-bg);color:var(--hw-ink);width:360px;max-width:100%;height:680px;border:1px solid var(--hw-line);border-radius:24px;position:relative;overflow:hidden;box-shadow:0 12px 35px #00000014;font-size:14px;line-height:1.55}
#hwpxxx-library-complete-grid .hw-phone[data-theme=light]{color-scheme:light}
#hwpxxx-library-complete-grid .hw-phone[data-theme=dark]{color-scheme:dark}
#hwpxxx-library-complete-grid .hw-screen{height:100%;display:flex;flex-direction:column;min-height:0}
#hwpxxx-library-complete-grid .hw-phone{color-scheme:inherit}
#hwpxxx-library-complete-grid .hw-phone button,#hwpxxx-library-complete-grid .hw-phone input,#hwpxxx-library-complete-grid .hw-phone select{font:inherit;color:inherit}
#hwpxxx-library-complete-grid .hw-phone button{border:0;background:transparent;padding:0;touch-action:manipulation}
#hwpxxx-library-complete-grid .hw-phone svg{width:22px;height:22px;flex:none;stroke-width:1.8;pointer-events:none}
#hwpxxx-library-complete-grid .hw-icon{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
#hwpxxx-library-complete-grid .hw-header{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;background:var(--hw-surface);flex:none}
#hwpxxx-library-complete-grid .hw-search{height:50px;display:flex;align-items:center;gap:9px;padding-left:12px;background:var(--hw-bg);color:var(--hw-muted);border-radius:13px;min-width:0;flex:1}
#hwpxxx-library-complete-grid .hw-search input{border:0;background:transparent;outline:none;min-width:0;width:100%;font-size:16px;height:100%;color:var(--hw-ink)}
#hwpxxx-library-complete-grid .hw-search input::placeholder{color:var(--hw-muted)}
#hwpxxx-library-complete-grid .hw-search input::-webkit-search-cancel-button{display:none}
#hwpxxx-library-complete-grid .hw-search .hw-clear{width:44px;height:48px}
#hwpxxx-library-complete-grid .hw-header .hw-settings{width:50px;height:50px;background:var(--hw-soft);color:var(--hw-brand);border-radius:13px}

 root.addEventListener('keydown',e=>{if(layer.hidden)return;if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const items=[...layer.querySelectorAll('button,summary,input,select')].filter(n=>!n.disabled&&n.getClientRects().length);if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0]?.focus();}}});
 let pullStart=null;
 root.addEventListener('touchstart',e=>{const sc=e.target.closest('.hw-doc-scroll');pullStart=state.permission&&sc&&sc.scrollTop===0&&e.touches.length===1?e.touches[0].clientY:null;},{passive:true});
 root.addEventListener('touchend',e=>{if(pullStart!==null&&e.changedTouches[0].clientY-pullStart>90){renderList();announce('문서 목록을 새로고침했습니다.');}pullStart=null;},{passive:true});
 new ResizeObserver(rail).observe(phone);
 let selectedDocument=null,folderPurpose='move',folderPath='',pdfName='',previewFolders=[];
 function docMenu(id){
  selectedDocument=docs.find(d=>d.id===id);if(!selectedDocument)return;pdfName='';folderPath='';previewFolders=[];
  dialog(selectedDocument.name,`<button type="button" class="hw-menu-action" data-act="rename-preview">${i('pencil')}<span>이름 변경</span></button><button type="button" class="hw-menu-action" data-act="move-preview">${i('folder-input')}<span>파일 이동</span></button><button type="button" class="hw-menu-action" data-act="pdf-preview">${i('file-down')}<span>PDF 저장</span></button><button type="button" class="hw-menu-action" data-act="info-preview">${i('info')}<span>파일 정보</span></button>`);
  layer.querySelector('.hw-dialog').classList.add('hw-library-menu');
 }
 function renamePreview(){
  const dot=selectedDocument.name.lastIndexOf('.'),stem=selectedDocument.name.slice(0,dot),extension=selectedDocument.name.slice(dot);
  dialog('이름 변경',`<label>파일 이름<div class="hw-form-name"><input class="hw-text-input" aria-label="파일 이름" value="${escape(stem)}"><span class="hw-file-extension">${escape(extension)}</span></div></label><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="close-dialog">취소</button><button type="button" class="hw-main-button" data-act="close-dialog">변경</button></div>`);
 }
 function pdfPreview(){
  if(!pdfName)pdfName=selectedDocument.name.replace(/\.[^.]+$/,'');
  dialog('PDF 저장',`<label>파일 이름<div class="hw-form-name"><input class="hw-text-input" data-pdf-name aria-label="PDF 파일 이름" value="${escape(pdfName)}"><span class="hw-file-extension">.pdf</span></div></label><label>저장 위치</label><button type="button" class="hw-location-control" data-act="pdf-location">${i('folder')}<span>${escape(folderPath||selectedDocument.folder)}</span>${i('chevron-right')}</button><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="close-dialog">취소</button><button type="button" class="hw-main-button" data-act="close-dialog">저장</button></div>`);
 }
 function infoPreview(){
  const d=selectedDocument;
  dialog('파일 정보',`<dl class="hw-info-list"><dt>이름</dt><dd>${escape(d.name)}</dd><dt>위치</dt><dd>내장 저장공간/${escape(d.folder)}</dd><dt>형식</dt><dd>${d.type}</dd><dt>크기</dt><dd>${escape(d.size)}</dd></dl>`);
 }
 function foldersPreview(purpose=folderPurpose,path=folderPath){
  folderPurpose=purpose;folderPath=path;
  const folders=folderPath?['업무자료','보관함',...previewFolders]:['Download','Documents','DCIM','Pictures','Recordings',...previewFolders];
  const same=folderPurpose==='move'&&folderPath===selectedDocument.folder;
  dialog('폴더 선택',`<div class="hw-folder-path">내장 저장공간${folderPath?' / '+escape(folderPath):''}</div><div class="hw-folder-list">${folderPath?`<button type="button" class="hw-folder-row" data-act="folder-parent">${i('corner-left-up')}<span>상위 폴더</span></button>`:''}${folders.map(f=>`<button type="button" class="hw-folder-row" data-act="folder-enter" data-folder="${escape(f)}">${i('folder')}<span>${escape(f)}</span>${i('chevron-right')}</button>`).join('')}</div><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="${folderPurpose==='pdf'?'pdf-preview':'close-dialog'}">취소</button><button type="button" class="hw-main-button" data-act="folder-confirm" ${same?'disabled':''}>${folderPurpose==='pdf'?'이 폴더 선택':'여기로 이동'}</button></div>`);
  const box=layer.querySelector('.hw-dialog');box.classList.add('hw-folder-dialog');
  const create=document.createElement('button');create.type='button';create.className='hw-icon cursor-interaction';create.dataset.act='folder-create';create.setAttribute('aria-label','폴더 만들기');create.innerHTML=i('folder-plus');
  const header=box.querySelector('.hw-dialog-header');header.insertBefore(create,header.lastElementChild);paintIcons();
 }
 function newFolderPreview(){
  dialog('폴더 만들기',`<label>폴더 이름<input class="hw-text-input" data-new-folder aria-label="폴더 이름" placeholder="새 폴더"></label><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="folder-cancel-create">취소</button><button type="button" class="hw-main-button" data-act="folder-create-confirm">만들기</button></div>`);
 }
 root.addEventListener('click',e=>{
  const button=e.target.closest('[data-act]');if(!button||button.disabled)return;
  const act=button.dataset.act;
  if(act==='rename-preview')renamePreview();
  else if(act==='move-preview'){folderPath=selectedDocument.folder;previewFolders=[];foldersPreview('move');}
  else if(act==='pdf-preview'){pdfPreview();}
  else if(act==='info-preview')infoPreview();
  else if(act==='pdf-location'){pdfName=layer.querySelector('[data-pdf-name]')?.value||pdfName;foldersPreview('pdf',folderPath||selectedDocument.folder);}
  else if(act==='folder-enter')foldersPreview(folderPurpose,folderPath?folderPath+'/'+button.dataset.folder:button.dataset.folder);
  else if(act==='folder-parent')foldersPreview(folderPurpose,folderPath.split('/').slice(0,-1).join('/'));
  else if(act==='folder-confirm'){if(folderPurpose==='pdf')pdfPreview();else closeDialog();}
  else if(act==='folder-create')newFolderPreview();
  else if(act==='folder-cancel-create')foldersPreview();
  else if(act==='folder-create-confirm'){const name=layer.querySelector('[data-new-folder]').value.trim();if(name)previewFolders.push(name);foldersPreview();}
 });
 let longPress=null,pressStart=null;
 function cancelLongPress(){clearTimeout(longPress);longPress=null;pressStart=null;}
 root.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.hw-star'))return;const item=e.target.closest('.hw-doc');if(!item)return;pressStart={x:e.clientX,y:e.clientY};longPress=setTimeout(()=>{docMenu(item.dataset.doc);cancelLongPress();},500);});
 root.addEventListener('pointermove',e=>{if(pressStart&&Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>10)cancelLongPress();});
 root.addEventListener('pointerup',cancelLongPress);root.addEventListener('pointercancel',cancelLongPress);
 root.addEventListener('contextmenu',e=>{const item=e.target.closest('.hw-doc');if(!item)return;e.preventDefault();cancelLongPress();docMenu(item.dataset.doc);});
 const previewPane=root.closest('[data-variant]');
 if(previewPane){const paneObserver=new MutationObserver(()=>{if(previewPane.hidden)pauseIntro();else resumeIntro();});paneObserver.observe(previewPane,{attributes:true,attributeFilter:['hidden']});addEventListener('pagehide',()=>paneObserver.disconnect(),{once:true});}

 render();
})();
</script>

</style>
<script>
(()=>{
 const root=document.getElementById('hwpxxx-library-complete-list'),phone=root.querySelector('.hw-phone'),screen=root.querySelector('.hw-screen'),layer=root.querySelector('.hw-modal-layer'),live=root.querySelector('#hw-complete-list-preview-live');
 const icons={search:'search',settings:'settings',star:'star',grid:'grid-2x2',list:'list'};
 const i=name=>`<i data-lucide="${icons[name]||name}" aria-hidden="true"></i>`;
 const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const docs=[{id:'a',name:'주간 업무회의록.hwp',title:'주간 업무회의록',folder:'Documents',type:'HWP',size:'128 KB',modified:8,favorite:true},{id:'b',name:'프로젝트 일정.hwpx',title:'프로젝트 일정',folder:'Download',type:'HWPX',size:'324 KB',modified:7,favorite:true},{id:'c',name:'2026년 사업계획 검토 의견 최종본.hwp',title:'사업계획 검토 의견',folder:'Download/업무자료/검토 문서',type:'HWP',size:'722 KB',modified:10,favorite:false},{id:'d',name:'업무 인수인계서.hwpx',title:'업무 인수인계서',folder:'Documents',type:'HWPX',size:'186 KB',modified:9,favorite:false},{id:'e',name:'회의 자료.hwp',title:'회의 자료',folder:'Download',type:'HWP',size:'94 KB',modified:6,favorite:false},{id:'f',name:'검토 메모.hwpx',title:'검토 메모',folder:'Documents',type:'HWPX',size:'212 KB',modified:5,favorite:false},{id:'g',name:'출장 보고서.hwp',title:'출장 보고서',folder:'Download',type:'HWP',size:'156 KB',modified:4,favorite:false}];
 const state={view:'list',permission:true,theme:'system',term:'',sort:'recent'};
 function paintIcons(){screen.querySelectorAll('.hw-doc').forEach(el=>{const d=docs.find(d=>d.id===el.dataset.doc);if(d)el.querySelector('.hw-name')?.setAttribute('data-tooltip',d.name);});root.querySelectorAll('button,summary').forEach(el=>el.classList.add('cursor-interaction'));globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
 function announce(t){live.textContent=t;}
 function thumb(d){return `<div class="hw-thumb"><div class="hw-mini"><div class="hw-mini-kicker">2026 · 업무 문서</div><strong>${escape(d.title)}</strong><div class="hw-line"></div><div class="hw-line short"></div><div class="hw-line"></div><div class="hw-mini-table"></div></div></div>`;}
 function render(){phone.dataset.theme=state.theme;phone.classList.remove('hw-edit-hidden');screen.innerHTML=`<header class="hw-header"><label class="hw-search">${i('search')}<input type="search" id="hw-complete-list-design-search" aria-label="문서 이름 검색" placeholder="문서 이름 검색" value="${escape(state.term)}"><button type="button" class="hw-icon hw-clear" data-act="clear" aria-label="검색어 지우기" ${state.term?'':'hidden'}>${i('x')}</button></label><button type="button" data-act="settings" aria-label="설정" aria-haspopup="dialog" class="hw-icon hw-settings">${i('settings')}</button></header><div class="hw-tools"><span id="hw-complete-list-design-count"></span><div class="hw-sort-tools"><select id="hw-complete-list-design-sort" aria-label="문서 정렬"><option value="recent">최근 수정순</option><option value="name">이름순</option><option value="size">큰 파일순</option></select><button type="button" class="hw-icon" data-act="view" aria-label="${state.view==='grid'?'목록 보기':'격자 보기'}">${i(state.view==='grid'?'list':'grid')}</button></div></div><div class="hw-doc-area"><div class="hw-doc-scroll"><div class="hw-docs" data-view="${state.view}"></div><div class="hw-empty" hidden></div></div><div class="hw-rail"><button type="button" class="hw-rail-thumb" aria-label="문서함 빠르게 스크롤"></button></div></div>`;screen.querySelector('#hw-complete-list-design-sort').value=state.sort;renderList();screen.querySelector('.hw-doc-scroll').addEventListener('scroll',rail,{passive:true});bindRail();paintIcons();}
 function renderList(){const matching=state.permission?docs.filter(d=>d.name.toLocaleLowerCase().includes(state.term.trim().toLocaleLowerCase())).sort((a,b)=>Number(b.favorite)-Number(a.favorite)||(state.sort==='name'?a.name.localeCompare(b.name,'ko'):state.sort==='size'?parseInt(b.size)-parseInt(a.size):b.modified-a.modified)):[];screen.querySelector('#hw-complete-list-design-count').textContent=`${matching.length}개 문서`;screen.querySelector('.hw-docs').innerHTML=matching.map(d=>`<article class="hw-doc" data-doc="${d.id}"><button type="button" class="hw-open" data-act="open" data-id="${d.id}" aria-label="${escape(d.name)} 열기">${state.view==='grid'?thumb(d):''}<div class="hw-doc-text"><span class="hw-name">${escape(d.name)}</span><div class="hw-path" data-tooltip="${escape(d.folder)}">${escape(d.folder)}</div><div class="hw-ext">${d.type} · ${d.size}</div></div></button><button type="button" class="hw-star" data-act="favorite" data-id="${d.id}" aria-label="${escape(d.name)} 즐겨찾기 ${d.favorite?'해제':'추가'}" aria-pressed="${d.favorite}">${i('star')}</button></article>`).join('');const empty=screen.querySelector('.hw-empty');empty.hidden=matching.length>0;empty.classList.toggle('hw-permission-intro',!state.permission);screen.querySelector('.hw-doc-scroll').classList.toggle('hw-access-empty',!state.permission);screen.querySelector('.hw-tools').hidden=!state.permission;screen.querySelector('.hw-rail').hidden=!state.permission;if(!matching.length)empty.innerHTML=state.permission?`${i('search-x')}<strong>검색 결과가 없어요</strong><div class="hw-permission-copy"><span>파일 이름을 확인하거나</span><span>검색어를 줄여보세요.</span></div>`:permissionPanel();screen.querySelector('.hw-clear').hidden=!state.term;paintIcons();requestAnimationFrame(()=>{rail();startIntro();});}
 function rail(){const sc=screen.querySelector('.hw-doc-scroll'),bar=screen.querySelector('.hw-rail'),t=screen.querySelector('.hw-rail-thumb');if(!sc||!bar)return;const h=bar.clientHeight,range=sc.scrollHeight-sc.clientHeight,height=Math.min(h,Math.max(48,h*sc.clientHeight/sc.scrollHeight));t.style.height=height+'px';t.style.top=(range>0?sc.scrollTop/range*(h-height):0)+'px';t.disabled=range<=0;}
 function bindRail(){const t=screen.querySelector('.hw-rail-thumb'),sc=screen.querySelector('.hw-doc-scroll');let drag=null;t.addEventListener('pointerdown',e=>{if(t.disabled)return;e.preventDefault();t.setPointerCapture(e.pointerId);drag={y:e.clientY,top:parseFloat(t.style.top)||0};});t.addEventListener('pointermove',e=>{if(!drag)return;const height=t.parentElement.clientHeight-t.clientHeight;if(height>0)sc.scrollTop=(drag.top+e.clientY-drag.y)/height*(sc.scrollHeight-sc.clientHeight);});for(const ev of ['pointerup','pointercancel'])t.addEventListener(ev,()=>drag=null);}
function permissionPanel(){return `
<div class="hw-onboarding" data-intro-stage="0" aria-label="문서 모아보기, 보안, 광고 없는 무료 사용 안내">
 <section class="hw-intro-slide hw-intro-active" data-slide="0" aria-hidden="false">
  <h2>한글 문서를<br>한곳에 모아보세요</h2>
  <p class="hw-intro-subtitle hw-collection-subtitle">폴더마다 흩어진 문서를<br>한눈에 찾아볼 수 있어요.</p>
  <div class="hw-collection"><div class="hw-collect-scene" role="img" aria-label="파일 다섯 개가 중앙 문서함으로 모이는 모습">
   <div class="hw-collect-destination" aria-hidden="true">${i('inbox')}<span class="hw-collect-title">문서함</span><span class="hw-collect-check">${i('check')}</span></div>
   ${['HWP','HWPX','HWP','HWPX','HWP'].map((type,n)=>`<span class="hw-anim-sheet" data-sheet="${n}" aria-hidden="true">${i('file-text')}<small>${type}</small></span>`).join('')}
  </div></div>
 </section>
 <section class="hw-intro-slide hw-intro-security" data-slide="1" aria-hidden="true">
  <h2>보안걱정 끝!<br>문서 유출 없어요.</h2>
  <p class="hw-intro-subtitle hw-security-top-copy">인터넷 연결 없이,<br>문서 작업은 자유롭게.</p>
  <div class="hw-flat-scene hw-security-art-scene" role="img" aria-label="업로드 아이콘과 글자를 감싼 굵은 원형 금지 표시">
<div class="hw-security-art hw-block-art hw-circle-art hw-circle-mode-filled" aria-hidden="true">
 <span class="hw-circle-wash"></span>
 <div class="hw-circle-pill">
  <span class="hw-circle-upload-group">
   <span class="hw-circle-upload">${i('upload')}</span>
   <span class="hw-circle-word">업로드</span>
  </span>
 </div>
 <span class="hw-circle-ring" data-block-anim="appear"></span>
 <span class="hw-circle-slash"><span class="hw-circle-stroke" data-block-anim="wipe"></span></span>
</div>
</div>
 </section>
 <section class="hw-intro-slide hw-intro-free" data-slide="2" aria-hidden="true">
  <h2>광고 없이<br>완전 무료</h2>
  <p class="hw-intro-subtitle hw-free-subtitle">결제 걱정 없이<br>문서에만 집중하세요.</p>
  <div class="hw-flat-scene hw-free-scene hw-free-c hw-alternating-free" role="img" aria-label="화면 중앙에서 AD를 가르는 광고 없음 안내와 0원이 강조되는 이용료 없음 안내가 번갈아 나타나는 모습">
   <div class="hw-free-stage hw-free-ad-stage" aria-hidden="true"><span class="hw-large-ad"><span class="hw-ad-letter hw-ad-upper">AD</span><span class="hw-ad-letter hw-ad-lower">AD</span></span><span class="hw-center-label">광고 없음</span></div>
   <div class="hw-free-stage hw-free-price-stage" aria-hidden="true"><span class="hw-large-zero">0<span>원</span></span><span class="hw-center-label">이용료 없음</span></div>
  </div>
 </section>
</div>
<div class="hw-intro-pager" aria-label="안내 화면 선택">${['문서 모아보기','보안','광고 없이 무료'].map((label,n)=>`<button type="button" class="hw-intro-dot" data-act="intro-page" data-page="${n}" aria-label="${label}" aria-pressed="${n===0}"></button>`).join('')}</div>
<button type="button" class="hw-main-button hw-permission-needed" data-act="grant">파일 접근 허용</button>
<p class="hw-permission-note">Android 설정에서<br>모든 파일에 대한 접근을 허용해 주세요.</p>`;}
 let collectionAnimations=[],collectionRun=0,lastFocus=null,modalView='settings';
 let introTimer=null,introStage=0,introStarted=0,introRemaining=5200;
 const introDurations=[5200,5600,6000];
 const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
 function cancelCollection(){collectionRun++;collectionAnimations.forEach(a=>a.cancel());collectionAnimations=[];}
 function playCollection(){cancelCollection();const run=collectionRun,scene=root.querySelector('.hw-collect-scene');if(!scene)return;const box=scene.querySelector('.hw-collect-destination'),w=scene.clientWidth,h=scene.clientHeight,cx=w/2,cy=h/2;box.classList.remove('hw-collected');const points=[[.17,.16],[.83,.18],[.91,.64],[.48,.91],[.08,.59]],turns=[-13,12,9,-10,-12];scene.querySelectorAll('.hw-anim-sheet').forEach((sheet,n)=>{const x=w*points[n][0]-20,y=h*points[n][1]-25,from=`translate(${x}px, ${y}px) rotate(${turns[n]}deg) scale(1)`;sheet.style.opacity='1';sheet.style.transform=from;if(reducedMotion.matches){sheet.style.transform=`translate(${cx-20+(n-2)*19}px, ${cy-78+Math.abs(n-2)*5}px) rotate(${(n-2)*6}deg) scale(.6)`;return;}const midX=x+(cx-20-x)*.67+(n%2?7:-7),midY=y+(cy-25-y)*.67;const a=sheet.animate([{transform:from,opacity:1},{transform:`translate(${midX}px, ${midY}px) rotate(0deg) scale(.72)`,opacity:1,offset:.68},{transform:`translate(${cx-20}px, ${cy-25}px) rotate(0deg) scale(.06)`,opacity:0}],{duration:1050,delay:650+n*250,easing:'cubic-bezier(.35,0,.18,1)',fill:'both'});collectionAnimations.push(a);if(!layer.hidden||document.hidden)a.pause();});if(reducedMotion.matches){box.classList.add('hw-collected');return;}Promise.all(collectionAnimations.map(a=>a.finished)).then(()=>{if(run===collectionRun&&box.isConnected)box.classList.add('hw-collected');}).catch(()=>{});}
function trackedAnimation(el,frames,options){const a=el.animate(frames,options);collectionAnimations.push(a);if(!layer.hidden||document.hidden)a.pause();return a;}
 function fitStoryIcon(wrapper,padding=1){const svg=wrapper.querySelector('svg');if(!svg)return;const box=svg.getBBox();if(box.width>0&&box.height>0)svg.setAttribute('viewBox',`${box.x-padding} ${box.y-padding} ${box.width+padding*2} ${box.height+padding*2}`);}
 function drawStoryStroke(wrapper,delay=450,duration=350,step=0){
  wrapper.querySelectorAll('svg path,svg line').forEach((path,n)=>{const length=path.getTotalLength();path.style.strokeDasharray=String(length);path.style.strokeDashoffset=reducedMotion.matches?'0':String(length);if(!reducedMotion.matches)trackedAnimation(path,[{strokeDashoffset:String(length)},{strokeDashoffset:'0'}],{duration,delay:delay+n*step,easing:'ease-in-out',fill:'both'});});
 }
 function playSecurity(){
  cancelCollection();const art=root.querySelector('.hw-block-art');if(!art||reducedMotion.matches)return;
  art.querySelectorAll('[data-block-anim]').forEach(el=>{
   const frames=el.dataset.blockAnim==='wipe'?[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 100% 0 0)',offset:.1},{clipPath:'inset(0 0 0 0)',offset:.23},{clipPath:'inset(0 0 0 0)'}]:[{opacity:.15},{opacity:.15,offset:.1},{opacity:1,offset:.23},{opacity:1}];
   trackedAnimation(el,frames,{duration:5600,fill:'both',easing:'ease-out'});
  });
 }

function playFree(){
  cancelCollection();const scene=root.querySelector('.hw-alternating-free');if(!scene)return;
  const ad=scene.querySelector('.hw-free-ad-stage'),price=scene.querySelector('.hw-free-price-stage'),upper=scene.querySelector('.hw-ad-upper'),lower=scene.querySelector('.hw-ad-lower');
  upper.style.transform='translate(-4px,-3px)';lower.style.transform='translate(4px,3px)';ad.style.opacity='1';price.style.opacity='0';price.style.transform='translate(-50%,-50%)';
  if(reducedMotion.matches){
   const step=frames=>frames.map(frame=>({...frame,easing:'steps(1,end)'}));
   trackedAnimation(ad,step([{opacity:1},{opacity:0,offset:.5},{opacity:0}]),{duration:6000,fill:'both'});
   trackedAnimation(price,step([{opacity:0},{opacity:1,offset:.5},{opacity:1}]),{duration:6000,fill:'both'});return;
  }
  trackedAnimation(upper,[{transform:'translate(0,0)'},{transform:'translate(-4px,-3px)'}],{duration:240,delay:710,fill:'both',easing:'ease-out'});
  trackedAnimation(lower,[{transform:'translate(0,0)'},{transform:'translate(4px,3px)'}],{duration:240,delay:710,fill:'both',easing:'ease-out'});
  // AD disappears completely before the price message becomes visible.
  trackedAnimation(ad,[{opacity:1},{opacity:1,offset:2600/6000},{opacity:0,offset:2800/6000},{opacity:0}],{duration:6000,fill:'both'});
  trackedAnimation(price,[{opacity:0},{opacity:0,offset:2800/6000},{opacity:1,offset:3040/6000},{opacity:1}],{duration:6000,fill:'both'});
  trackedAnimation(price,[{transform:'translate(-50%,-50%) scale(.97)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:300,delay:2800,fill:'both',easing:'ease-out'});
 }
 function playCurrentIntro(){if(introStage===0)playCollection();else if(introStage===1)playSecurity();else playFree();}
let introRequested=0,introChanging=false,introReady=false,introFade=null,introRun=0,introPhase='idle';
 function introIsPaused(){return !layer.hidden||document.hidden||root.closest('[data-variant]')?.hidden===true;}
 function setIntroSelection(panel,index){
  introStage=index;panel.dataset.introStage=String(index);
  panel.querySelectorAll('[data-slide]').forEach(slide=>{const active=Number(slide.dataset.slide)===index;slide.classList.toggle('hw-intro-active',active);slide.setAttribute('aria-hidden',String(!active));slide.style.opacity=active?'1':'0';});
  panel.parentElement.querySelectorAll('[data-act="intro-page"]').forEach((button,n)=>button.setAttribute('aria-pressed',String(n===index)));
 }
 function scheduleIntro(){
  clearTimeout(introTimer);introTimer=null;
  if(state.permission||introChanging||introIsPaused()||!root.querySelector('.hw-onboarding'))return;
  introStarted=performance.now();introTimer=setTimeout(()=>{introTimer=null;setIntroStage((introStage+1)%3);},Math.max(0,introRemaining));
 }
 async function fadeIntroSlide(slide,from,to,duration,run){
  slide.style.opacity=String(from);
  const animation=slide.animate([{opacity:from},{opacity:to}],{duration,easing:'cubic-bezier(.4,0,.2,1)',fill:'both'});
  introFade=animation;if(introIsPaused())animation.pause();
  try{await animation.finished;}catch{return false;}
  if(run!==introRun)return false;
  slide.style.opacity=String(to);animation.cancel();if(introFade===animation)introFade=null;
  return true;
 }
 async function changeIntroScreen(panel){
  const run=++introRun;introChanging=true;clearTimeout(introTimer);introTimer=null;
  collectionAnimations.forEach(animation=>animation.pause());
  try{
   while(run===introRun&&introRequested!==introStage){
    const outgoing=panel.querySelector('[data-slide="'+introStage+'"]');introPhase='out';
    if(!await fadeIntroSlide(outgoing,1,0,160,run))return;
    // The previous illustration remains frozen until its whole slide is hidden.
    const target=introRequested;setIntroSelection(panel,target);
    const incoming=panel.querySelector('[data-slide="'+target+'"]');incoming.style.opacity='0';
    playCurrentIntro();
    // Prepare the new picture at its first frame; start its motion after the fade.
    collectionAnimations.forEach(animation=>{animation.pause();animation.currentTime=0;});
    introPhase='in';if(!await fadeIntroSlide(incoming,0,1,240,run))return;
   }
  }finally{
   if(run===introRun){
    introChanging=false;introPhase='idle';introRemaining=introDurations[introStage];
    if(!introIsPaused())collectionAnimations.forEach(animation=>{if(animation.playState==='paused')animation.play();});
    scheduleIntro();
   }
  }
 }
 function setIntroStage(index){
  const panel=root.querySelector('.hw-onboarding');if(!panel||state.permission)return;
  index=Math.max(0,Math.min(2,Number(index)||0));introRequested=index;
  if(!introReady||reducedMotion.matches){
   introRun++;introFade?.cancel();introFade=null;introChanging=false;introPhase='idle';clearTimeout(introTimer);introTimer=null;
   setIntroSelection(panel,index);introReady=true;playCurrentIntro();introRemaining=introDurations[index];scheduleIntro();return;
  }
  // Rapid taps update the destination without interrupting a fade in progress.
  if(!introChanging&&index!==introStage)void changeIntroScreen(panel);
 }
 function stopIntro(){
  introRun++;clearTimeout(introTimer);introTimer=null;introFade?.cancel();introFade=null;introChanging=false;introReady=false;introPhase='idle';cancelCollection();
 }
 function startIntro(){stopIntro();if(!state.permission&&root.querySelector('.hw-onboarding'))setIntroStage(0);}
 function pauseIntro(){
  if(introTimer!==null){clearTimeout(introTimer);introTimer=null;introRemaining=Math.max(0,introRemaining-(performance.now()-introStarted));}
  if(introFade?.playState==='running')introFade.pause();
  collectionAnimations.forEach(animation=>{if(animation.playState==='running')animation.pause();});
 }
 function resumeIntro(){
  if(state.permission||introIsPaused())return;
  if(introChanging){if(introFade?.playState==='paused')introFade.play();return;}
  collectionAnimations.forEach(animation=>{if(animation.playState==='paused')animation.play();});scheduleIntro();
 }
 reducedMotion.addEventListener('change',()=>{if(!state.permission){const target=introRequested;stopIntro();setIntroStage(target);}});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseIntro();else resumeIntro();});
 function dialog(title,body,back=false){if(layer.hidden)lastFocus=document.activeElement;screen.inert=true;layer.hidden=false;root.querySelector('[data-act="settings"]')?.setAttribute('aria-expanded','true');pauseIntro();layer.innerHTML=`<section class="hw-dialog" role="dialog" aria-modal="true" aria-labelledby="hw-complete-list-settings-title"><header class="hw-dialog-header">${back?`<button type="button" class="hw-icon" data-act="settings-back" aria-label="설정으로 돌아가기">${i('arrow-left')}</button>`:''}<h2 id="hw-complete-list-settings-title">${escape(title)}</h2><button type="button" class="hw-icon" data-act="close-dialog" aria-label="닫기">${i('x')}</button></header>${body}</section>`;paintIcons();layer.querySelector('button')?.focus({preventScroll:true});}
 function closeDialog(){layer.hidden=true;layer.replaceChildren();screen.inert=false;root.querySelector('[data-act="settings"]')?.setAttribute('aria-expanded','false');resumeIntro();if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});}
 function settings(){modalView='settings';dialog('설정',`<section class="hw-setting-group hw-theme-group"><h3>화면 테마</h3><div class="hw-theme-options" role="group" aria-label="화면 테마">${[['system','monitor','기기 설정'],['light','sun','밝게'],['dark','moon','어둡게']].map(([value,icon,label])=>`<button type="button" data-act="set-theme" data-value="${value}" aria-pressed="${state.theme===value}">${i(icon)}<span>${label}</span></button>`).join('')}</div></section><div class="hw-setting-group"><button type="button" class="hw-setting" data-act="help">${i('circle-help')}<span class="hw-setting-copy">사용 방법</span>${i('chevron-right')}</button><button type="button" class="hw-setting" data-act="about">${i('info')}<span class="hw-setting-copy">앱 정보</span>${i('chevron-right')}</button></div>`);}
 function help(){modalView='help';dialog('사용 방법',`<section class="hw-help-item"><h3>문서 새로고침</h3><p>문서함을 누르고 아래로 당기면<br>기기의 문서를 다시 찾아요.</p></section><section class="hw-help-item"><h3>즐겨찾기</h3><p>문서의 별을 누르면<br>목록 위에 먼저 표시돼요.</p></section><section class="hw-help-item"><h3>보기 방식</h3><p>문서 목록 위의 보기 버튼을 누르면<br>격자와 목록을 바꿀 수 있어요.</p></section>`,true);}
 function about(){modalView='about';dialog('앱 정보',`<div class="hw-about-brand">${i('file-text')}<span>hwpxxx</span></div><p class="hw-about-copy">기기 안에서 문서를 처리하는<br>오프라인 한글 문서 앱</p><p class="hw-about-copy">문서 엔진 · rhwp 0.8.7<br>광고·추적 기능 없이 사용할 수 있어요.</p><details><summary>오픈소스 안내</summary><p>rhwp · 문서 처리 엔진<br>Lucide · 아이콘<br>Noto Sans KR · 글꼴</p></details>`,true);}
 root.addEventListener('click',e=>{const button=e.target.closest('[data-act]');if(!button||button.disabled){if(e.target===layer)closeDialog();return;}const act=button.dataset.act;if(act==='intro-page'){setIntroStage(Number(button.dataset.page));}else if(act==='settings'||act==='settings-back'){settings();}else if(act==='close-dialog'){closeDialog();}else if(act==='help'){help();}else if(act==='about'){about();}else if(act==='set-theme'){state.theme=button.dataset.value;phone.dataset.theme=state.theme;layer.querySelectorAll('[data-act="set-theme"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===state.theme)));}else if(act==='grant'){dialog('파일 접근 허용',`<p class="hw-about-copy">기기에 저장된 한글 문서를 찾아<br>문서함에 모아 표시합니다.</p><button type="button" class="hw-main-button" data-act="close-dialog">확인</button>`);}else if(act==='view'){state.view=state.view==='grid'?'list':'grid';render();}else if(act==='favorite'){const d=docs.find(d=>d.id===button.dataset.id);d.favorite=!d.favorite;renderList();root.querySelector('[data-act="favorite"][data-id="'+d.id+'"]')?.focus({preventScroll:true});}else if(act==='clear'){state.term='';root.querySelector('#hw-complete-list-design-search').value='';renderList();root.querySelector('#hw-complete-list-design-search').focus();}});
 root.addEventListener('input',e=>{if(e.target.id==='hw-complete-list-design-search'){state.term=e.target.value;renderList();}});
 root.addEventListener('change',e=>{if(e.target.id==='hw-complete-list-design-sort'){state.sort=e.target.value;renderList();}});
 root.addEventListener('keydown',e=>{if(layer.hidden)return;if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const items=[...layer.querySelectorAll('button,summary,input,select')].filter(n=>!n.disabled&&n.getClientRects().length);if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1)?.focus();}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0]?.focus();}}});
 let pullStart=null;
 root.addEventListener('touchstart',e=>{const sc=e.target.closest('.hw-doc-scroll');pullStart=state.permission&&sc&&sc.scrollTop===0&&e.touches.length===1?e.touches[0].clientY:null;},{passive:true});
 root.addEventListener('touchend',e=>{if(pullStart!==null&&e.changedTouches[0].clientY-pullStart>90){renderList();announce('문서 목록을 새로고침했습니다.');}pullStart=null;},{passive:true});
 new ResizeObserver(rail).observe(phone);
 let selectedDocument=null,folderPurpose='move',folderPath='',pdfName='',previewFolders=[];
 function docMenu(id){
  selectedDocument=docs.find(d=>d.id===id);if(!selectedDocument)return;pdfName='';folderPath='';previewFolders=[];
  dialog(selectedDocument.name,`<button type="button" class="hw-menu-action" data-act="rename-preview">${i('pencil')}<span>이름 변경</span></button><button type="button" class="hw-menu-action" data-act="move-preview">${i('folder-input')}<span>파일 이동</span></button><button type="button" class="hw-menu-action" data-act="pdf-preview">${i('file-down')}<span>PDF 저장</span></button><button type="button" class="hw-menu-action" data-act="info-preview">${i('info')}<span>파일 정보</span></button>`);
  layer.querySelector('.hw-dialog').classList.add('hw-library-menu');
 }
 function renamePreview(){
  const dot=selectedDocument.name.lastIndexOf('.'),stem=selectedDocument.name.slice(0,dot),extension=selectedDocument.name.slice(dot);
  dialog('이름 변경',`<label>파일 이름<div class="hw-form-name"><input class="hw-text-input" aria-label="파일 이름" value="${escape(stem)}"><span class="hw-file-extension">${escape(extension)}</span></div></label><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="close-dialog">취소</button><button type="button" class="hw-main-button" data-act="close-dialog">변경</button></div>`);
 }
 function pdfPreview(){
  if(!pdfName)pdfName=selectedDocument.name.replace(/\.[^.]+$/,'');
  dialog('PDF 저장',`<label>파일 이름<div class="hw-form-name"><input class="hw-text-input" data-pdf-name aria-label="PDF 파일 이름" value="${escape(pdfName)}"><span class="hw-file-extension">.pdf</span></div></label><label>저장 위치</label><button type="button" class="hw-location-control" data-act="pdf-location">${i('folder')}<span>${escape(folderPath||selectedDocument.folder)}</span>${i('chevron-right')}</button><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="close-dialog">취소</button><button type="button" class="hw-main-button" data-act="close-dialog">저장</button></div>`);
 }
 function infoPreview(){
  const d=selectedDocument;
  dialog('파일 정보',`<dl class="hw-info-list"><dt>이름</dt><dd>${escape(d.name)}</dd><dt>위치</dt><dd>내장 저장공간/${escape(d.folder)}</dd><dt>형식</dt><dd>${d.type}</dd><dt>크기</dt><dd>${escape(d.size)}</dd></dl>`);
 }
 function foldersPreview(purpose=folderPurpose,path=folderPath){
  folderPurpose=purpose;folderPath=path;
  const folders=folderPath?['업무자료','보관함',...previewFolders]:['Download','Documents','DCIM','Pictures','Recordings',...previewFolders];
  const same=folderPurpose==='move'&&folderPath===selectedDocument.folder;
  dialog('폴더 선택',`<div class="hw-folder-path">내장 저장공간${folderPath?' / '+escape(folderPath):''}</div><div class="hw-folder-list">${folderPath?`<button type="button" class="hw-folder-row" data-act="folder-parent">${i('corner-left-up')}<span>상위 폴더</span></button>`:''}${folders.map(f=>`<button type="button" class="hw-folder-row" data-act="folder-enter" data-folder="${escape(f)}">${i('folder')}<span>${escape(f)}</span>${i('chevron-right')}</button>`).join('')}</div><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="${folderPurpose==='pdf'?'pdf-preview':'close-dialog'}">취소</button><button type="button" class="hw-main-button" data-act="folder-confirm" ${same?'disabled':''}>${folderPurpose==='pdf'?'이 폴더 선택':'여기로 이동'}</button></div>`);
  const box=layer.querySelector('.hw-dialog');box.classList.add('hw-folder-dialog');
  const create=document.createElement('button');create.type='button';create.className='hw-icon cursor-interaction';create.dataset.act='folder-create';create.setAttribute('aria-label','폴더 만들기');create.innerHTML=i('folder-plus');
  const header=box.querySelector('.hw-dialog-header');header.insertBefore(create,header.lastElementChild);paintIcons();
 }
 function newFolderPreview(){
  dialog('폴더 만들기',`<label>폴더 이름<input class="hw-text-input" data-new-folder aria-label="폴더 이름" placeholder="새 폴더"></label><div class="hw-dialog-actions"><button type="button" class="hw-sub-button" data-act="folder-cancel-create">취소</button><button type="button" class="hw-main-button" data-act="folder-create-confirm">만들기</button></div>`);
 }
 root.addEventListener('click',e=>{
  const button=e.target.closest('[data-act]');if(!button||button.disabled)return;
  const act=button.dataset.act;
  if(act==='rename-preview')renamePreview();
  else if(act==='move-preview'){folderPath=selectedDocument.folder;previewFolders=[];foldersPreview('move');}
  else if(act==='pdf-preview'){pdfPreview();}
  else if(act==='info-preview')infoPreview();
  else if(act==='pdf-location'){pdfName=layer.querySelector('[data-pdf-name]')?.value||pdfName;foldersPreview('pdf',folderPath||selectedDocument.folder);}
  else if(act==='folder-enter')foldersPreview(folderPurpose,folderPath?folderPath+'/'+button.dataset.folder:button.dataset.folder);
  else if(act==='folder-parent')foldersPreview(folderPurpose,folderPath.split('/').slice(0,-1).join('/'));
  else if(act==='folder-confirm'){if(folderPurpose==='pdf')pdfPreview();else closeDialog();}
  else if(act==='folder-create')newFolderPreview();
  else if(act==='folder-cancel-create')foldersPreview();
  else if(act==='folder-create-confirm'){const name=layer.querySelector('[data-new-folder]').value.trim();if(name)previewFolders.push(name);foldersPreview();}
 });
 let longPress=null,pressStart=null;
 function cancelLongPress(){clearTimeout(longPress);longPress=null;pressStart=null;}
 root.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.hw-star'))return;const item=e.target.closest('.hw-doc');if(!item)return;pressStart={x:e.clientX,y:e.clientY};longPress=setTimeout(()=>{docMenu(item.dataset.doc);cancelLongPress();},500);});
 root.addEventListener('pointermove',e=>{if(pressStart&&Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>10)cancelLongPress();});
 root.addEventListener('pointerup',cancelLongPress);root.addEventListener('pointercancel',cancelLongPress);
 root.addEventListener('contextmenu',e=>{const item=e.target.closest('.hw-doc');if(!item)return;e.preventDefault();cancelLongPress();docMenu(item.dataset.doc);});
 const previewPane=root.closest('[data-variant]');
 if(previewPane){const paneObserver=new MutationObserver(()=>{if(previewPane.hidden)pauseIntro();else resumeIntro();});paneObserver.observe(previewPane,{attributes:true,attributeFilter:['hidden']});addEventListener('pagehide',()=>paneObserver.disconnect(),{once:true});}

 render();
})();
</script>
</section>
</div>
