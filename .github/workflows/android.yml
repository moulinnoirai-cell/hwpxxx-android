name: Android tablet build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use the main Ubuntu archive for apt (the runner's Azure mirror is sometimes unresolvable and fails every apt step)
        run: |
          sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt || true
          cat /etc/apt/apt-mirrors.txt || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache/restore@v4
        id: memo-engine
        with:
          path: .build/engine
          key: rhwp-engine-${{ runner.os }}-${{ hashFiles('config/android-engine.json', 'scripts/build-engine.sh', 'scripts/install-engine.mjs') }}
      # The pinned upstream checkout is needed on EVERY run: the engine build (cache miss only) and the Studio build (always;
      # scripts/build-studio.mjs reads rhwp-studio, assets/fonts, assets/logo and the licence files via `git archive` of this commit).
      - uses: actions/checkout@v4
        with:
          repository: edwardkim/rhwp
          ref: c9095c5f67632e6721e800ccc7fb43ea49d26682
          path: .build/rhwp
          sparse-checkout: |
            rhwp-studio
            rhwp-shared
            data
            mydocs/manual
            mydocs/tech
            packaging/crates-io
            tests
            src
            crates
            tools
            bindings
            vendor
            scripts
            assets
            fonts
            resources
            .cargo
      - uses: dtolnay/rust-toolchain@stable
        if: steps.memo-engine.outputs.cache-hit != 'true'
        with:
          toolchain: 'nightly-2026-02-01'
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.memo-engine.outputs.cache-hit != 'true'
        with:
          workspaces: .build/rhwp
          key: android-engine-v3
          cache-on-failure: true
      - name: Install pinned wasm-bindgen CLI
        if: steps.memo-engine.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 -o /tmp/wasm-bindgen.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz
          echo '61d4a7dc85acfa0d2354ccc0b8361928c7e52a746d17f28ebaa795ed3dc1614a  /tmp/wasm-bindgen.tar.gz' | sha256sum --check
          mkdir -p .build/wasm-bindgen
          tar -xzf /tmp/wasm-bindgen.tar.gz --strip-components=1 -C .build/wasm-bindgen
          echo "$PWD/.build/wasm-bindgen" >> "$GITHUB_PATH"
      - name: Fetch embedded blank document
        if: steps.memo-engine.outputs.cache-hit != 'true'
        run: |
          mkdir -p .build/rhwp/saved
          git -C .build/rhwp show HEAD:saved/blank2010.hwp > .build/rhwp/saved/blank2010.hwp
      - run: bash scripts/build-engine.sh .build/rhwp
        if: steps.memo-engine.outputs.cache-hit != 'true'
      - run: node scripts/install-engine.mjs .build/engine
      - uses: actions/cache/save@v4
        if: steps.memo-engine.outputs.cache-hit != 'true'
        with:
          path: .build/engine
          key: ${{ steps.memo-engine.outputs.cache-primary-key }}
      - name: Build the Studio frontend (feature patches + Android patches, npm ci, strict-CSP production bundle for /studio/)
        run: |
          node scripts/build-studio.mjs --upstream .build/rhwp --run-tests
          node scripts/verify-studio.mjs
      - run: node tests/build-qa-fixtures.mjs
      - name: Engine integrity gate (pinned build, build-info.json hashes, CI pins)
        run: |
          node scripts/verify-engine.mjs
          node --test tests/engine-integrity.test.mjs
      - name: Studio build gates (pins, destructive-path guard, verifyStudio negative cases, CSP equals MainActivity)
        run: |
          node scripts/verify-studio.mjs
          node --test tests/studio-build.test.mjs
      - name: Release automation gates (signed-release job guards, upstream check on a fixture repository)
        run: node --test tests/release-automation.test.mjs
      - name: Document worker regression tests
        run: node --test tests/editor-features.test.mjs tests/editor-worker.test.mjs
      - name: Emulator test harness (ANR guard parsers and decisions, no device needed)
        run: |
          node --test tests/android-anr.test.mjs tests/android-termux-fixtures.test.mjs
          for f in tests/android-emulator.cjs tests/android-termux.cjs tests/android-suites.cjs tests/android-system.cjs tests/android-anr-parse.cjs tests/legacy-webview-driver.cjs; do node --check "$f"; done
      - name: Install fonts for the FontStore JVM test (real TTF regular/bold + CFF OTF come from distro packages; the Korean face is the bundled Noto Sans KR)
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-urw-base35; then break; fi
            if [ "$attempt" = 3 ]; then echo "apt failed in all 3 attempts"; exit 1; fi
            echo "apt failed (attempt $attempt); retrying"; sleep 20
          done
          for f in LiberationSans-Regular.ttf LiberationSans-Bold.ttf NimbusSans-Regular.otf; do
            p="$(find /usr/share/fonts -name "$f" | head -n 1)"
            test -n "$p" || { echo "font fixture $f not installed"; exit 1; }
            echo "$p"
          done
      - name: File/export/font/private-state/host-intent/clipboard store regression tests (JVM, SDK 35 classpath)
        run: |
          mkdir -p build/fs-test
          H=app/src/main/java/kr/offline/hwp
          # ClipboardImageProvider extends android.content.ContentProvider: compile (and run its pure pruning test) with the SDK 35 android.jar installed by the sdkmanager step; no Android runtime is started.
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_JAR" || { echo "missing $ANDROID_JAR"; exit 1; }
          javac -encoding UTF-8 -cp "$ANDROID_JAR" -d build/fs-test $H/FileStore.java $H/TimedCall.java $H/TermuxWalker.java $H/DraftStore.java $H/ExportStore.java $H/FontStore.java $H/PrivateStateStore.java $H/ClipboardImageProvider.java $H/HostIntents.java $H/HostState.java $H/ProviderRead.java $H/NativeSessions.java $H/NativeHandleRegistry.java tests/FileStoreTest.java tests/TermuxWalkerTest.java tests/DraftStoreTest.java tests/ExportStoreTest.java tests/FontStoreTest.java tests/PrivateStateStoreTest.java tests/ClipboardImageProviderTest.java tests/HostIntentsTest.java tests/HostStateTest.java tests/NativeAvailabilityTest.java $H/WorkspaceModel.java $H/WorkspaceStateStore.java $H/WorkspaceRequests.java $H/WorkspaceServices.java tests/WorkspaceModelTest.java tests/WorkspaceStateStoreTest.java tests/WorkspaceServicesTest.java tests/WorkspaceConcurrencyTest.java tests/WorkspaceIsolationTest.java
          java -cp build/fs-test kr.offline.hwp.FileStoreTest tests/fixtures/문서.hwp tests/fixtures/문서.hwpx
          java -cp build/fs-test kr.offline.hwp.TermuxWalkerTest
          java -cp build/fs-test kr.offline.hwp.DraftStoreTest tests/fixtures/문서.hwp tests/fixtures/문서.hwpx
          java -cp build/fs-test kr.offline.hwp.ExportStoreTest tests/fixtures/문서.hwp tests/fixtures/문서.hwpx
          java -cp build/fs-test kr.offline.hwp.PrivateStateStoreTest "$H/PrivateStateStore.java"
          java -cp build/fs-test kr.offline.hwp.HostIntentsTest
          java -cp build/fs-test kr.offline.hwp.HostStateTest
          java -cp build/fs-test kr.offline.hwp.NativeAvailabilityTest
          java -cp build/fs-test kr.offline.hwp.WorkspaceModelTest
          java -cp build/fs-test kr.offline.hwp.WorkspaceStateStoreTest
          java -cp "build/fs-test:$ANDROID_JAR" kr.offline.hwp.WorkspaceServicesTest tests/fixtures/문서.hwp "$(find /usr/share/fonts -name LiberationSans-Regular.ttf | head -n 1)"
          java -cp build/fs-test kr.offline.hwp.WorkspaceConcurrencyTest tests/fixtures/문서.hwp
          java -cp "build/fs-test:$ANDROID_JAR" kr.offline.hwp.WorkspaceIsolationTest tests/fixtures "$H/FileStore.java" "$H/ExportStore.java" "$H/MainActivity.java"
          java -cp "build/fs-test:$ANDROID_JAR" kr.offline.hwp.ClipboardImageProviderTest
          fonts() { find /usr/share/fonts -name "$1" | head -n 1; }
          java -cp build/fs-test kr.offline.hwp.FontStoreTest "$(fonts LiberationSans-Regular.ttf)" "$(fonts LiberationSans-Bold.ttf)" "$(fonts NimbusSans-Regular.otf)" app/src/main/assets/fonts/NotoSansKR-Regular.ttf
      - name: Font provider and host protocol tests (Node; real studio-host.js against a mock OfflineNative, no WebView)
        run: |
          npm install --no-save --package-lock=false playwright@1.48.2
          python -m pip install playwright numpy pillow
          python -m playwright install --with-deps chromium
          # The tests default to /usr/bin/chromium (local sandbox); on the runner use the browser Playwright just installed.
          CHROME="$(python -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_NODE_MODULES=$PWD/node_modules" >> "$GITHUB_ENV"
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$CHROME" PLAYWRIGHT_NODE_MODULES="$PWD/node_modules"
          # These tests drive several real Studio pages and have timing races on a loaded runner: a failure is retried (up to 3 attempts in total);
          # a real regression fails every attempt.
          for attempt in 1 2 3; do
            if STUDIO_WORKSPACE_SRC="$PWD/.build/studio-src" node --test --test-concurrency=1 tests/android-fonts.test.mjs tests/studio-host.test.mjs tests/studio-workspace-host.test.mjs tests/workspace-oracle.test.mjs tests/workspace-server.test.mjs; then break; fi
            if [ "$attempt" = 3 ]; then echo "host protocol tests failed in all 3 attempts"; exit 1; fi
            echo "host protocol tests failed (attempt $attempt); retrying"
          done
      - name: Production desktop Studio browser tests (real patched Studio + WASM in Chromium; native bridge is a MOCK — not WebView, not DeX)
        run: |
          python tests/studio-ui.py
          python tests/studio-workspace.py --root-announced-build --workspace
      - name: Android integration tests on the patched Studio source tree (real WasmBridge, real fonts provider and save lifecycle in Chromium; native bridge is a MOCK)
        run: |
          S="$PWD/.build/studio-src/rhwp-studio"
          python tests/android-font-renderer.py --studio-root "$S"
          python tests/studio-save-lifecycle.py --studio-root "$S"
          python tests/studio-interaction.py --studio-root "$S"
          node tests/studio-hwpxxx-features.mjs --studio-root "$S" --throttle 4
      - name: Studio smoke with a minimal STUB host (contract/CSP/offline; stub is not the real studio-host.js)
        run: python tests/studio-smoke.py
      - name: Legacy bespoke-editor fallback browser tests (the original limited UI kept as fallback; NOT the desktop Studio)
        run: |
          python tests/tablet-ui.py
          python tests/dex-ui.py
          python tests/review-ui.py
          python tests/desktop-ui.py
      - name: Build installable debug and unsigned release APKs
        run: bash gradlew assembleDebug assembleRelease lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-fixtures
          path: .qa/fixtures/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hwpxxx-android-0.3.0
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/lint-results-release.html
            .qa/tablet-*.png
            .qa/dex-*.png
            .qa/review-*.png
            .qa/desktop-*.png
            .qa/desktop-ui-results.json
            .qa/studio-*
            app/src/main/assets/studio/build-info.json
            app/src/main/assets/engine/build-info.json
          include-hidden-files: true
          if-no-files-found: warn

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [33]
    steps:
      - uses: actions/checkout@v4
      - name: Use the main Ubuntu archive for apt (the runner's Azure mirror is sometimes unresolvable and fails every apt step)
        run: |
          sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt || true
          cat /etc/apt/apt-mirrors.txt || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: hwpxxx-android-0.3.0
      - uses: actions/download-artifact@v4
        with:
          name: android-test-fixtures
          path: .qa/fixtures
      - run: npm install --no-save --package-lock=false playwright@1.48.2
      - run: python -m pip install pillow
      - name: Download official Termux for private-project integration tests
        run: bash scripts/fetch-termux-qa.sh
      - name: Reserve disk space for emulator userdata
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          enable-hw-keyboard: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -feature -Vulkan
          script: sh tests/run-emulator-suites.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-api-${{ matrix.api }}
          path: .qa/android-*
          include-hidden-files: true
          if-no-files-found: warn

  # Signed release: runs only for a pushed version tag (see docs/RELEASE.md), after the build and the emulator suites are green.
  # The keystore secrets are used in this job only; the job never runs for pull requests.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      # SHA-256 of the signing certificate of the release key (hwpxxx-release.p12, adopted as the official key after v0.2.0). A different key is refused.
      EXPECTED_CERT_SHA256: d7763191854c02a1e2589dc69c92521f10f0eded2ebd310b07d65fb69cb7f4c8
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag must point at a commit that is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: hwpxxx-android-*
          path: ci-artifact
          merge-multiple: true
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Sign and verify the release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::set the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets (docs/RELEASE.md)"; exit 1; }
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$ks"
          unsigned="$(find ci-artifact -name app-release-unsigned.apk | head -n 1)"
          [ -n "$unsigned" ] || { echo "::error::the build artifact has no app-release-unsigned.apk"; exit 1; }
          mkdir -p dist
          core="${TAG#v}"; core="${core%%-*}"   # v0.3.1-rc.1 -> the APK's versionName must start with 0.3.1
          bash scripts/sign-release.sh "$unsigned" "dist/hwpxxx-${TAG#v}.apk" "$ks" "$core"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="dist/hwpxxx-${TAG#v}.apk"
          sum="$(cut -d' ' -f1 "$apk.sha256")"
          flags=(--verify-tag --generate-notes)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          {
            echo "Signed release build (CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- APK SHA-256: \`$sum\`"
            echo "- Signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`"
          } > release-notes.md
          gh release create "$TAG" "$apk" "$apk.sha256" --title "$TAG" --notes-file release-notes.md "${flags[@]}"
