plugins { id 'com.android.application' }

// Release signing comes from local.properties (never committed):
//   release.storeFile=C:/path/hwpxxx-release.jks
//   release.passwordFile=C:/path/keystore-password.txt
def local = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { local.load(it) }
def storePath = local.getProperty('release.storeFile')
def passwordPath = local.getProperty('release.passwordFile')

android {
    namespace 'kr.offline.hwp'
    compileSdk 35
    defaultConfig { applicationId 'kr.offline.hwp'; minSdk 30; targetSdk 35; versionCode 5; versionName '0.3.0' }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (storePath && passwordPath) {
            release {
                def password = new File(passwordPath).text.trim()
                storeFile file(storePath); storePassword password; keyAlias 'hwpxxx'; keyPassword password
            }
        }
    }
    buildTypes { debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview' }; release { minifyEnabled false; if (storePath && passwordPath) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}


// The packaged engine must be the pinned memo engine built by scripts/build-engine.sh: build-info.json is required, repeats every pin of
// config/android-engine.json, and its SHA-256 values must match rhwp.js, rhwp_bg.wasm and rhwp.d.ts on disk (so a new glue next to a stale
// binary is refused). scripts/verify-engine.mjs holds the logic (tested by tests/engine-integrity.test.mjs); there is no skip switch.
tasks.register('verifyMemoEngine', Exec) {
    description = 'Fails the build unless the packaged rhwp engine matches config/android-engine.json and build-info.json'
    workingDir rootProject.projectDir
    commandLine 'node', 'scripts/verify-engine.mjs'
}
tasks.named('preBuild').configure { dependsOn 'verifyMemoEngine' }
